// One settings file, two modules: the app and nothing else -- the native
// core is not a module, it is built by the app's externalNativeBuild out of
// native/CMakeLists.txt, the same sources the desktop rig compiles.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "hakios-ios6"
include ':app'
