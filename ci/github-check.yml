# The CI workflow lives where GitHub Actions actually runs it:
# .github/workflows/check.yml (it was here since the beginning, but a
# workflow outside .github/workflows/ never runs -- stage 9 moved it and
# wired the desktop rig and the APK build into it).
#
# What it checks, in short:
#   check        python compiles, shell parses, no Apple files in the tree,
#                the kernel patch applies to Apple's xnu-8796 tag, the APFS
#                tools, the POCO X5 Pro SoC-args regression
#   desktop-rig  the app edition's stages 2-8 on the host g++ (including the
#                whole-machine demo-kernel test) and the fixture round-trip
#   apk          the universal APK (arm64-v8a, armeabi-v7a, x86_64) built by
#                the NDK, uploaded as an artifact of every push
